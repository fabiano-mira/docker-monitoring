# Standalone stack for the Copilot Studio network analyzer.
#
# Deliberately separate from the parent repo's docker-compose.yml: this project
# only consumes ntopng over HTTP, so it can run on the same host, on another
# box, or anywhere with a route to NTOPNG_URL.

services:
  gateway:
    build: ./gateway
    image: ntopng-copilot-gateway:0.1.0
    container_name: ntopng-copilot-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      # Bound to localhost: the tunnel below is what faces the internet, so the
      # gateway itself never needs an open port on the LAN.
      - "127.0.0.1:8800:8000"

  # Publishes the gateway to a hostname Copilot Studio can reach. Microsoft's
  # cloud cannot route to 10.9.1.241, so something must bridge that gap; this
  # is the least-privilege option (outbound-only, no inbound firewall rule).
  #
  # Enable with:  docker compose --profile tunnel up -d
  # Token comes from a Cloudflare Zero Trust tunnel you create first.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ntopng-copilot-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - gateway
