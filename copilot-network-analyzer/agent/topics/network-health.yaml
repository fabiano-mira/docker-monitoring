# Copilot Studio topic — network status, with an explicit degraded path.
#
# Worth having as a topic rather than leaving to the model: when ntopng is
# unreachable the user should get a clear "monitoring is down" answer instead
# of a generative apology that reads like the network is fine.

kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Network health
    triggerQueries:
      - how is my network
      - network status
      - is everything ok on the network
      - give me a network update
      - anything unusual on the network

  actions:
    - kind: InvokeConnectorAction
      id: getHealth
      connectionReference: shared_ntopngnetworkanalyzer
      connectionProperties:
        mode: Invoker
      operationId: GetHealth
      output:
        binding:
          Topic.Health: =Value

    - kind: ConditionGroup
      id: isHealthy
      conditions:
        - id: ntopngUp
          condition: =Topic.Health.ntopng_reachable
          actions:
            - kind: InvokeConnectorAction
              id: getSummary
              connectionReference: shared_ntopngnetworkanalyzer
              connectionProperties:
                mode: Invoker
              operationId: GetNetworkSummary
              inputs:
                binding:
                  top: 5
              output:
                binding:
                  Topic.Summary: =Value

            - kind: SendActivity
              id: replySummary
              activity: "{Topic.Summary.summary}"
      elseActions:
        - kind: SendActivity
          id: replyDegraded
          activity: |-
            I can't reach the ntopng monitor right now, so I have no visibility
            into the network. This means monitoring is down — not that the
            network is quiet.

            Detail: {Topic.Health.detail}
