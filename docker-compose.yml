services:
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring

  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp_exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /Users/fm/Library/Logs/goflow2:/var/log/goflow2:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=netmon-admin-pw
      - DOCKER_INFLUXDB_INIT_ORG=netmon
      - DOCKER_INFLUXDB_INIT_BUCKET=netflow
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=netmon-local-dev-token-2026
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - monitoring

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    environment:
      - INFLUX_TOKEN=netmon-local-dev-token-2026
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /Users/fm/Library/Logs/goflow2:/var/log/goflow2:ro
    depends_on:
      - influxdb
    networks:
      - monitoring

  redis-ntopng:
    image: redis:alpine
    container_name: redis-ntopng
    restart: unless-stopped
    networks:
      - monitoring

  influxdb-ntopng:
    image: influxdb:1.8
    container_name: influxdb-ntopng
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=ntopng
    volumes:
      - influxdb_ntopng_data:/var/lib/influxdb
    ports:
      - "8087:8086"
    networks:
      - monitoring

  netflow2ng:
    image: synfinatic/netflow2ng:latest
    container_name: netflow2ng
    restart: unless-stopped
    command:
      - "--listen=0.0.0.0:2055"
      - "--listen-zmq=tcp://*:5556"
      - "--metrics=0.0.0.0:8080"
    ports:
      - "2056:2055/udp"
      - "8091:8080"
    networks:
      - monitoring

  ntopng:
    image: ntop/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    command:
      - "--community"
      - "--redis"
      - "redis-ntopng"
      - "--interface"
      - "tcp://netflow2ng:5556"
      - "--disable-login"
      - "1"
      - "--local-networks"
      - "10.9.1.0/24,192.168.3.0/24"
      - "--insecure"
    volumes:
      - ntopng_data:/var/lib/ntopng
    ports:
      - "3001:3000"
    depends_on:
      - netflow2ng
      - redis-ntopng
      - influxdb-ntopng
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node_exporter
      - snmp_exporter
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  influxdb_data:
  influxdb_ntopng_data:
  ntopng_data:
