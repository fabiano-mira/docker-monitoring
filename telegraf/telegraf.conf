[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true

[[inputs.tail]]
  files = ["/var/log/goflow2/flows.log"]
  from_beginning = false
  watch_method = "poll"
  data_format = "json_v2"
  name_override = "netflow"

  [[inputs.tail.json_v2]]
    [[inputs.tail.json_v2.tag]]
      path = "src_addr"
      rename = "src_addr"
    [[inputs.tail.json_v2.tag]]
      path = "dst_addr"
      rename = "dst_addr"
    [[inputs.tail.json_v2.tag]]
      path = "proto"
      rename = "proto"
    [[inputs.tail.json_v2.tag]]
      path = "dst_port"
      rename = "dst_port"
    [[inputs.tail.json_v2.tag]]
      path = "src_port"
      rename = "src_port"
    [[inputs.tail.json_v2.tag]]
      path = "in_if"
      rename = "in_if"
    [[inputs.tail.json_v2.tag]]
      path = "out_if"
      rename = "out_if"
    [[inputs.tail.json_v2.tag]]
      path = "type"
      rename = "flow_type"
    [[inputs.tail.json_v2.field]]
      path = "bytes"
      rename = "bytes"
      type = "int"
    [[inputs.tail.json_v2.field]]
      path = "packets"
      rename = "packets"
      type = "int"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "netmon"
  bucket = "netflow"
