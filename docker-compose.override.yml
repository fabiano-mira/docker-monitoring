# Local-machine overrides.
# A pre-existing standalone `grafana` container (volume `grafana-storage`) already
# occupies the container name `grafana` and host port 3000, so this stack's Grafana
# is renamed and published on 3002 instead.
services:
  grafana:
    container_name: grafana-monitoring
    # !override replaces the base `ports` list instead of appending to it,
    # which would otherwise still try to bind the conflicting port 3000.
    ports: !override
      - "3002:3000"
